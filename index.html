let K;
function toKitchen(){state='swirl';K={step:'wash',i:0,dirt:1,strips:0,acc:0,inPot:0,flying:[],boil:0,mash:0,bonk:0,done:0,swirl:0,last:0};SND.sparkle();ui();pops=[]}
const STEPS={wash:'Step 1: WASH 🫧',peel:'Step 2: PEEL 🔪',cook:'Step 3: COOK 🍲',boil:'Step 3: COOK 🔥',mash:'Step 4: MASH 💪',done:'Yum! 🧈'};
function potC(){return{x:W/2,y:H*.5,rx:Math.min(110*S,W*.28),ry:Math.min(75*S,W*.19)}}
function kMove(p,dx,dy){const P=potC(),inside=Math.abs(p.x-P.x)<P.rx*1.5&&Math.abs(p.y-P.y)<P.ry*1.8,d=Math.hypot(dx,dy);

function counterPos(i){return{x:W*.14+(i%5)*W*.18,y:H*.80+Math.floor(i/5)*H*.075}}
function potPos(){return{x:W*.5,y:H*.47}}
function kTap(p){if(K.step=='cook'){for(let i=0;i<10;i++){if(K.flying.some(f=>f.i==i)||i<K.taken?.length&&K.taken[i])continue;}
K.taken=K.taken||Array(10).fill(false);let best_=-1,bd=60*S;for(let i=0;i<10;i++){if(K.taken[i])continue;const q=counterPos(i),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best_=i}}

if(best_>=0){K.taken[best_]=true;const q=counterPos(best_);K.flying.push({i:best_,x:q.x,y:q.y,p:0});SND.peel()}}
else if(K.step=='mash'){K.mash=Math.min(1,K.mash+1/22);K.bonk=8;SND.mash();const b=bowlC();for(let j=0;j<4;j++)parts.push({x:b.x+(R()-.5)*b.r,y:b.y-b.r*.2,vx:(R()-.5)*4*S,vy:-(1+R()*3)*S,l:30,k:'mashp'});

else if(K.step=='done'&&K.done>90){level++;startDig()}}
function bowlC(){return{x:W/2,y:H*.56,r:Math.min(120*S,W*.32)}}
function kitchenStep(k){if(msgT>0)msgT--;
if(K.step=='cook'){for(const f of K.flying){f.p+=.04*k}const landed=K.flying.filter(f=>f.p>=1);if(landed.length){K.inPot+=landed.length;SND.plop();SND.splash();const pp=potPos();for(let j=0;j<8;j++)parts.push({x:pp.x+(R()-.5)*60*S,y:pp.y-30*S,vx:(R()-.5)*3*S,vy:-(2+R()*2)*S,l:30,k:'w'})}
K.flying=K.flying.filter(f=>f.p<1);if(K.inPot>=10){K.step='boil';K.boil=0;msg='Bubble bubble… 🔥';msgT=60}}
else if(K.step=='boil'){K.boil+=k/(60*4.5);if(t%7==0)SND.bubble();const pp=potPos();if(R()<.5)parts.push({x:pp.x+(R()-.5)*90*S,y:pp.y-36*S,vx:0,vy:-.4*S,l:40,k:'b',r:(3+R()*5)*S});if(K.boil>=1){K.step='mash';msg='Soft & ready! Mash time!';msgT=90;SND.sparkle()}}

else if(K.step=='done')K.done++;
