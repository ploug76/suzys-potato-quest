$('mute').textContent=muted?'🔇':'🔊';$('mute').onclick=e=>{e.stopPropagation();muted=!muted;localStorage.setItem('spqMute',muted?'1':'0');$('mute').textContent=muted?'🔇':'🔊'};

document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();A();want(D[b.dataset.d])}));

let pd=null;

c.addEventListener('pointermove',e=>{if(!pd)return;const p=pt(e),dx=p.x-pd.x,dy=p.y-pd.y;pd.moved+=Math.hypot(dx,dy);
if(state=='dig'){const sx=p.x-pd.sx,sy=p.y-pd.sy;if(sx*sx+sy*sy>(22*DPR)**2){want(Math.abs(sx)>Math.abs(sy)?[Math.sign(sx),0]:[0,Math.sign(sy)]);pd.sx=p.x;pd.sy=p.y}}

function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function tap(p){if(state=='title'||state=='over'){if(state=='over'||t>20)newGame();return}if(state=='kitchen'&&!paused&&p)kTap(p)}
// ---------- DIG
const cx=c=>GX+(c+.5)*CS,cy=r=>GY+(r+.5)*CS,isDug=(c,r)=>r==0||(r>0&&r<ROWS&&c>=0&&c<COLS&&dug[r][c]),rockAt=(c,r)=>rocks.find(k=>k.st!='gone'&&Math.round(k.c)==c&&Math.round(k.r)==r);
function newGame(){score=0;hearts=3;const q=parseInt(new URLSearchParams(location.search).get('level'));level=q>0?q:1;startDig()}
function startDig(){dug=[...Array(ROWS)].map(()=>Array(COLS).fill(false));dug[0].fill(true);suzy={c:5,r:0,tc:5,tr:0,p:0,x:5,y:0,dir:[0,0],want:[0,0],flip:1,step:0};inv=60;got=0;parts=[];pops=[];
const L=level;moles=[];rocks=[];pots=[];
const nm=Math.min(7,1+Math.floor(L*.7));for(let i=0;i<nm;i++){const r=3+Math.floor(R()*(ROWS-4)),c0=Math.floor(R()*(COLS-3));for(let k=0;k<3;k++)dug[r][c0+k]=true;if(R()<.4&&r+1<ROWS)dug[r+1][c0+1]=true;
moles.push({c:c0+1,r,tc:c0+1,tr:r,p:0,x:c0+1,y:r,dir:[R()<.5?1:-1,0],sp:Math.min(.075,.025+.006*L),ghost:0,gt:200+R()*400,wob:R()*9,col:PICK(['#8d6e63','#6d4c41','#a1887f'])})}
const nr=Math.min(7,2+Math.floor(L/2));for(let i=0;i<nr;i++){for(let tries=0;tries<40;tries++){const c=Math.floor(R()*COLS),r=2+Math.floor(R()*(ROWS-4));if(!dug[r][c]&&!dug[r+1][c]&&!rockAt(c,r)&&!(Math.abs(c-5)<1&&r<4)){rocks.push({c,r,st:'still',tm:0});break}}}
const minR=Math.min(9,1+Math.floor((L-1)/2)),deep=Math.min(.85,.1*(L-1));
while(pots.length<10){const r=R()<deep?Math.max(minR,ROWS-5)+Math.floor(R()*5):minR+Math.floor(R()*(ROWS-minR)),c=Math.floor(R()*COLS);if(r<1||r>=ROWS||dug[r][c]||rockAt(c,r)||pots.some(p=>p.c==c&&p.r==r))continue;pots.push({c,r,got:false,wob:R()*9})}
state='dig';paused=false;msg='Level '+level+': dig up 10 potatoes!';msgT=150;ui()}
function canEnter(c,r){return c>=0&&c<COLS&&r>=0&&r<ROWS&&!rockAt(c,r)}
function digStep(k){if(inv>0)inv--;if(msgT>0)msgT--;if(faceT>0)faceT--;else face=0;
const s=suzy;
if(s.p==0){const w=s.want;if(w&&!(w[0]||w[1]))s.dir=[0,0];else if(w&&canEnter(s.c+w[0],s.r+w[1]))s.dir=w;else if(!canEnter(s.c+s.dir[0],s.r+s.dir[1]))s.dir=[0,0];
if(s.dir[0]||s.dir[1]){s.tc=s.c+s.dir[0];s.tr=s.r+s.dir[1]}}
else if(s.want&&(s.want[0]||s.want[1])&&s.want[0]==-s.dir[0]&&s.want[1]==-s.dir[1]){[s.c,s.tc]=[s.tc,s.c];[s.r,s.tr]=[s.tr,s.r];s.p=1-s.p;s.dir=s.want}
if(s.dir[0]||s.dir[1]){if(rockAt(s.tc,s.tr)&&s.p<.3){s.p=0;s.tc=s.c;s.tr=s.r;s.dir=[0,0]}else{const sp=(isDug(s.tc,s.tr)?.085:.05)*k;s.p+=sp;s.step+=sp;if(s.dir[0])s.flip=s.dir[0];
if(s.p>.4&&s.tr>0&&!dug[s.tr][s.tc]){dug[s.tr][s.tc]=true;score+=1;SND.dig();for(let i=0;i<3;i++)parts.push({x:cx(s.tc),y:cy(s.tr),vx:(R()-.5)*3*S,vy:-R()*3*S,l:25,k:'d'})}
if(s.p>=1){s.c=s.tc;s.r=s.tr;s.p=0}}}
s.x=s.c+(s.tc-s.c)*s.p;s.y=s.r+(s.tr-s.r)*s.p;
// potatoes
for(const p of pots)if(!p.got&&Math.hypot(s.x-p.c,s.y-p.r)<.6){p.got=true;got++;score+=100;SND.pop();face=1;faceT=50;sparkAt(cx(p.c),cy(p.r),14);pops.push({x:cx(p.c),y:cy(p.r)-20*S,s:PICK(['Spud-tacular!','Tater-rific!','Hello, potato!','Yay, a spud!','Po-tay-to!','Mash-terpiece!']),l:60});
if(got>=10){score+=50*level;toKitchen();return}}
// moles
for(const m of moles){if(m.squash){m.squash--;continue}m.gt-=k;
if(level>=3&&!m.ghost&&m.gt<=0&&R()<.01){m.ghost=1;m.gt=0}
if(m.ghost){const a=Math.atan2(s.y-m.y,s.x-m.x),gs=Math.min(.03,.012+.002*level)*k;m.x+=Math.cos(a)*gs;m.y+=Math.sin(a)*gs;m.ghost+=k;
const mc=Math.round(m.x),mr=Math.round(m.y);if(m.ghost>90&&isDug(mc,mr)&&mr>0&&Math.abs(m.x-mc)<.1&&Math.abs(m.y-mr)<.1){m.x=m.c=m.tc=mc;m.y=m.r=m.tr=mr;m.p=0;m.ghost=0;m.gt=300+R()*400;m.dir=[0,0]}}
else{if(m.p==0){
const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>{const nc=m.c+d[0],nr=m.r+d[1];return nr>0&&isDug(nc,nr)&&!rockAt(nc,nr)});
const fwd=opts.filter(d=>!(d[0]==-m.dir[0]&&d[1]==-m.dir[1]));let ch=fwd.length?fwd:opts;
if(ch.length){if(R()<Math.min(.7,.08*level)){ch.sort((a,b)=>Math.hypot(m.c+a[0]-s.x,m.r+a[1]-s.y)-Math.hypot(m.c+b[0]-s.x,m.r+b[1]-s.y));m.dir=ch[0]}else m.dir=PICK(ch);m.tc=m.c+m.dir[0];m.tr=m.r+m.dir[1]}else m.dir=[0,0]}
if(m.dir[0]||m.dir[1]){m.p+=m.sp*k;if(m.p>=1){m.c=m.tc;m.r=m.tr;m.p=0}}m.x=m.c+(m.tc-m.c)*m.p;m.y=m.r+(m.tr-m.r)*m.p}
if(inv<=0&&Math.hypot(m.x-s.x,m.y-s.y)<.7)hurt(PICK(['Eek, a grumpy mole!','Hey, no biting!','Mole-y moly!']))}
// rocks

else if(rk.st=='wob'){if(--rk.tm<=0)rk.st='fall'}
else if(rk.st=='fall'){rk.r+=.16*k;const nr=Math.floor(rk.r)+1;
if(inv<=0&&Math.abs(s.x-rk.c)<.6&&Math.abs(s.y-rk.r)<.7)hurt(PICK(['Bonk! Rock on the hat!','Ouchie, a rock!']));

if(nr>=ROWS||!dug[nr][rk.c]){rk.r=Math.floor(rk.r);rk.st='crumble';rk.tm=30;SND.rock();shake=8}}
else if(rk.st=='crumble'){if(--rk.tm<=0){rk.st='gone';for(let i=0;i<8;i++)parts.push({x:cx(rk.c),y:cy(rk.r),vx:(R()-.5)*4*S,vy:-R()*3*S,l:30,k:'r'})}}}
moles=moles.filter(m=>!(m.dead&&m.squash<=0));
fxStep()}
function hurt(m){hearts--;inv=120;shake=12;SND.hurt();face=2;faceT=60;msg=m;msgT=80;if(hearts<=0){state='over';if(score>best){best=score;localStorage.setItem('spqBest',best)}ui()}}
function sparkAt(x,y,n,sp){for(let i=0;i<n;i++){const a=R()*TAU,v=(.5+R())*(sp||3)*S;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:40+R()*20,k:'s',c:PICK(['#ffe066','#ff8fd8','#8fe9ff','#fff','#b9ff8f'])})}}
function fxStep(){for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.k=='d'||p.k=='r'||p.k=='peel'){p.vy+=.15*S}if(p.k=='b'){p.vy-=.02*S;p.x+=Math.sin(p.l*.2)*.3*S}p.l--}parts=parts.filter(p=>p.l>0);for(const p of pops){p.y-=.5*S;p.l--}pops=pops.filter(p=>p.l>0)}
// ---------- KITCHEN
let K;
function toKitchen(){state='swirl';K={step:'wash',i:0,dirt:1,strips:0,acc:0,inPot:0,flying:[],boil:0,mash:0,bonk:0,done:0,swirl:0,last:0};SND.sparkle();ui();pops=[]}
const STEPS={wash:'Step 1: WASH 🫧',peel:'Step 2: PEEL 🔪',cook:'Step 3: COOK 🍲',boil:'Step 3: COOK 🔥',mash:'Step 4: MASH 💪',done:'Yum! 🧈'};
function potC(){return{x:W/2,y:H*.5,rx:Math.min(110*S,W*.28),ry:Math.min(75*S,W*.19)}}
function kMove(p,dx,dy){const P=potC(),inside=Math.abs(p.x-P.x)<P.rx*1.5&&Math.abs(p.y-P.y)<P.ry*1.8,d=Math.hypot(dx,dy);
if(K.step=='wash'&&inside){K.dirt-=d/(380*DPR);if(R()<.4)parts.push({x:p.x+(R()-.5)*30*S,y:p.y+(R()-.5)*30*S,vx:(R()-.5)*S,vy:-R()*S,l:50,k:'b',r:(3+R()*6)*S});if(t-K.last>5){SND.scrub();K.last=t}
if(R()<.15)parts.push({x:p.x,y:p.y,vx:(R()-.5)*2*S,vy:2*S,l:30,k:'d'});
if(K.dirt<=0)nextPotato('Squeaky clean!')}
else if(K.step=='peel'&&inside){K.acc+=d;if(K.acc>95*DPR){K.acc=0;K.strips++;SND.peel();for(let j=0;j<2;j++)parts.push({x:p.x,y:p.y,vx:(R()-.5)*6*S,vy:-(2+R()*3)*S,l:60,k:'peel',rot:R()*6});
if(K.strips>=4)nextPotato('Peel-tastic!')}}}
function nextPotato(m){SND.sparkle();const P=potC();sparkAt(P.x,P.y,16);pops.push({x:P.x,y:P.y-P.ry-20*S,s:m,l:45});K.i++;K.dirt=1;K.strips=0;K.acc=0;
if(K.i>=10){K.i=0;if(K.step=='wash'){K.step='peel';msg='All clean! Now peel them.';msgT=90}else{K.step='cook';msg='Into the pot they go!';msgT=90}}}
function counterPos(i){return{x:W*.14+(i%5)*W*.18,y:H*.80+Math.floor(i/5)*H*.075}}
function potPos(){return{x:W*.5,y:H*.47}}
function kTap(p){if(K.step=='cook'){for(let i=0;i<10;i++){if(K.flying.some(f=>f.i==i)||i<K.taken?.length&&K.taken[i])continue;}
K.taken=K.taken||Array(10).fill(false);let best_=-1,bd=60*S;for(let i=0;i<10;i++){if(K.taken[i])continue;const q=counterPos(i),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best_=i}}
